name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test without HID bindings or a controller
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry points
        run: |
          python bin/gamesir-battery.py --help
          python bin/gamesir-battery.py --status
          python install.py --help
